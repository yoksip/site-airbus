<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Site themable aéronautique, éditable via un panneau d'administration multi-utilisateurs.">
  <link rel="icon" href="assets/plane.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">

  <header class="site-header">

        <img src="assets/plane.svg" class="brand-mark" alt="">
